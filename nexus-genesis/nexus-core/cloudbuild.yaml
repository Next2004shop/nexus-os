# NEXUS Sovereign System - Cloud Build Configuration
# Architecture: Multi-Agent Council × Netflix-Grade Resilience
# Version: 3.0.0

steps:
  # 1. Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/nexus-repo/nexus-core:$BUILD_ID'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/nexus-repo/nexus-core:latest'
      - '.'

  # 2. Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'us-central1-docker.pkg.dev/$PROJECT_ID/nexus-repo/nexus-core']

  # 3. Deploy to Cloud Run with Netflix-grade configuration
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'nexus-core'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/nexus-repo/nexus-core:$BUILD_ID'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      
      # =========================================
      # SECURITY CONFIGURATION
      # =========================================
      # Require authentication for all requests
      - '--no-allow-unauthenticated'
      # Service account with minimal permissions
      - '--service-account'
      - 'nexus-runtime@$PROJECT_ID.iam.gserviceaccount.com'
      
      # =========================================
      # SECRET MANAGER INTEGRATION
      # =========================================
      - '--set-secrets'
      - 'BINANCE_API_KEY=BINANCE_API_KEY:latest,BINANCE_API_SECRET=BINANCE_API_SECRET:latest,MT5_LOGIN=MT5_LOGIN:latest,MT5_PASSWORD=MT5_PASSWORD:latest,MT5_SERVER=MT5_SERVER:latest,POLYGON_API_KEY=POLYGON_API_KEY:latest,SECRET_ENCRYPTION_KEY=SECRET_ENCRYPTION_KEY:latest,MT_BRIDGE_SIGNING_KEY=MT_BRIDGE_SIGNING_KEY:latest,NEXUS_MASTER_USER_ID=NEXUS_MASTER_USER_ID:latest'
      
      # =========================================
      # NETFLIX-GRADE SCALING CONFIGURATION
      # =========================================
      # Always keep 1 instance warm (no cold starts for trading)
      - '--min-instances'
      - '1'
      # Scale up to 10 instances under load
      - '--max-instances'
      - '10'
      # Concurrency: requests per instance before scaling
      - '--concurrency'
      - '80'
      
      # =========================================
      # RESOURCE ALLOCATION
      # =========================================
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      # Disable CPU throttling for consistent performance
      - '--cpu-boost'
      - '--no-cpu-throttling'
      # Request timeout (5 minutes for complex analysis)
      - '--timeout'
      - '300'
      
      # =========================================
      # HEALTH CHECKS & PROBES
      # =========================================
      # CPU boost during startup for faster initialization
      - '--cpu-boost'
      
      # =========================================
      # ENVIRONMENT CONFIGURATION
      # =========================================
      - '--set-env-vars'
      - 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID,LOG_LEVEL=INFO,ENVIRONMENT=production,NEXUS_VERSION=3.0.0,COUNCIL_QUORUM=0.6'
      
      # =========================================
      # REVISION MANAGEMENT
      # =========================================
      # Traffic routing (100% to new revision)
      - '--revision-suffix'
      - 'v3-council-${SHORT_SHA}'

# Store the image in Artifact Registry
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/nexus-repo/nexus-core:$BUILD_ID'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/nexus-repo/nexus-core:latest'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'  # Faster builds

# Build timeout
timeout: '1200s'

