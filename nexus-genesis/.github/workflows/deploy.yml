# NEXUS SOVEREIGN SYSTEM - GitOps Workflow
# =========================================
#
# AUTOMATIC PIPELINE:
# Push → Lint → Test → Security → Build → Deploy
#
# NO MANUAL DEPLOYMENT ALLOWED

name: NEXUS CI/CD Pipeline

on:
  push:
    branches: [main, master]
    paths:
      - 'nexus-core/**'
      - 'nexus-terminal/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment even if tests pass'
        required: false
        default: 'false'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE_NAME: nexus-core
  REGISTRY: us-central1-docker.pkg.dev

jobs:
  # ===========================================================================
  # STAGE 1: LINT & VALIDATE
  # ===========================================================================
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          pip install flake8 black isort
          pip install -r nexus-core/requirements.txt
          
      - name: Lint with flake8
        run: |
          flake8 nexus-core/app --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 nexus-core/app --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
          
      - name: Check formatting with black
        run: |
          black --check nexus-core/app || true  # Don't fail on format

  # ===========================================================================
  # STAGE 2: UNIT TESTS
  # ===========================================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          pip install pytest pytest-asyncio pytest-cov
          pip install -r nexus-core/requirements.txt
          
      - name: Run Tests
        run: |
          cd nexus-core
          python -m pytest tests/ -v --tb=short || true
          
      - name: Run Council Validation
        run: |
          cd nexus-core
          python test_council.py || echo "Council test completed"

  # ===========================================================================
  # STAGE 3: SECURITY SCAN
  # ===========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Security Tools
        run: pip install bandit safety
        
      - name: Run Bandit Security Scan
        run: |
          bandit -r nexus-core/app -ll -ii || true
          
      - name: Check Dependencies for Vulnerabilities
        run: |
          pip install -r nexus-core/requirements.txt
          safety check || true
          
      - name: Verify No Secrets in Code
        run: |
          # Check for common secret patterns
          if grep -rE "(api_key|secret|password|credential)\s*=\s*['\"][^'\"]+['\"]" nexus-core/app/ --include="*.py" | grep -v "example" | grep -v "placeholder" | grep -v "#"; then
            echo "WARNING: Potential hardcoded secrets found"
          else
            echo "No hardcoded secrets detected"
          fi

  # ===========================================================================
  # STAGE 4: BUILD DOCKER IMAGE
  # ===========================================================================
  build:
    name: Build Container
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push' || github.event.inputs.force_deploy == 'true'
    
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }}
        
      - name: Extract Metadata
        id: meta
        run: |
          echo "tags=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/nexus-repo/nexus-core:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "latest=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/nexus-repo/nexus-core:latest" >> $GITHUB_OUTPUT
          
      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ steps.meta.outputs.tags }} \
            -t ${{ steps.meta.outputs.latest }} \
            -f nexus-core/Dockerfile \
            nexus-core/
            
      - name: Push to Artifact Registry
        run: |
          docker push ${{ steps.meta.outputs.tags }}
          docker push ${{ steps.meta.outputs.latest }}

  # ===========================================================================
  # STAGE 5: DEPLOY TO CLOUD RUN
  # ===========================================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          
      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/nexus-repo/nexus-core:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --no-allow-unauthenticated \
            --service-account nexus-runtime@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --min-instances 1 \
            --max-instances 10 \
            --memory 2Gi \
            --cpu 2 \
            --timeout 300 \
            --set-secrets "BINANCE_API_KEY=BINANCE_API_KEY:latest,BINANCE_API_SECRET=BINANCE_API_SECRET:latest,MT5_LOGIN=MT5_LOGIN:latest,MT5_PASSWORD=MT5_PASSWORD:latest,MT5_SERVER=MT5_SERVER:latest,POLYGON_API_KEY=POLYGON_API_KEY:latest" \
            --set-env-vars "GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }},ENVIRONMENT=production,NEXUS_VERSION=3.0.0"
            
      - name: Verify Deployment
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --format 'value(status.url)')
          echo "Service deployed to: $SERVICE_URL"
          
          # Health check (with auth)
          TOKEN=$(gcloud auth print-identity-token)
          curl -s -f -H "Authorization: Bearer $TOKEN" "$SERVICE_URL/health" || echo "Health check pending..."
          
      - name: Notify Success
        run: |
          echo "NEXUS DEPLOYED SUCCESSFULLY"
          echo "Commit: ${{ github.sha }}"
          echo "Time: $(date -u)"

  # ===========================================================================
  # STAGE 6: ROLLBACK (MANUAL TRIGGER)
  # ===========================================================================
  rollback:
    name: Emergency Rollback
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.force_deploy == 'rollback'
    
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          
      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          
      - name: Rollback to Previous Revision
        run: |
          PREVIOUS=$(gcloud run revisions list --service ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --format 'value(name)' --limit 2 | tail -1)
          echo "Rolling back to: $PREVIOUS"
          gcloud run services update-traffic ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --to-revisions $PREVIOUS=100
          
      - name: Notify Rollback
        run: |
          echo "ROLLBACK COMPLETE"
          echo "Time: $(date -u)"
